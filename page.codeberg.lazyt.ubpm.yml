app-id: page.codeberg.lazyt.ubpm
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: ubpm
rename-desktop-file: ubpm.desktop
rename-icon: ubpm
finish-args:
  - --socket=x11
# wayland fails to open default browser?
#  - --socket=wayland
#  - --socket=fallback-x11
  - --socket=cups
  - --device=all
  - --share=ipc
  - --share=network
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --filesystem=home
  - --filesystem=/run/udev:ro
modules:
  - name: ubpm
    no-parallel-make: true
    buildsystem: qmake
    config-opts:
      - DEFINES+=FLATPAK
    subdir: sources
    sources:
      - type: git
        url: https://codeberg.org/lazyt/ubpm.git
        commit: 6d23b8d81e1a5ec175721f1a359b8497a668c0e9
