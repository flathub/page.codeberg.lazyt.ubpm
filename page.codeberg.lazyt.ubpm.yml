app-id: page.codeberg.lazyt.ubpm
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: ubpm
rename-desktop-file: ubpm.desktop
rename-icon: ubpm
finish-args:
  - --socket=x11
# wayland fails to open default browser?
#  - --socket=wayland
#  - --socket=fallback-x11
  - --socket=cups
  - --device=all
  - --share=ipc
  - --share=network
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  - --filesystem=home
  - --filesystem=/run/udev:ro
modules:
# removed (incompatible with Qt updates)
#  - name: qsqlcipher
#    buildsystem: simple
#    build-commands:
#      - cmake . && cmake --build . --parallel $(nproc)
#      - install -Dt /app/bin/sqldrivers libqsqlcipher.so
#    sources:
#      - type: git
#        url: https://github.com/chehrlic/qsqlcipher-qt6.git
#        commit: 4abad01430b0400ca8fd3818e1d73680870d1625
  - name: ubpm
    no-parallel-make: true
    buildsystem: qmake
    config-opts:
      - DEFINES+=FLATPAK
    subdir: sources
    sources:
      - type: git
        url: https://codeberg.org/lazyt/ubpm.git
        commit: c921ad6c4d6436bb447403988955f2f29335160a
      - type: patch
        path: fix-build-errors.patch
